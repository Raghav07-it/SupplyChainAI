services:
  - type: web
    name: chainsight-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: CORS_ORIGINS
        value: "https://chainsightai-mu.vercel.app"
      - key: DATABASE_URL
        fromDatabase:
          name: chainsight-db
          property: connectionString

databases:
  - name: chainsight-db
    databaseName: supplychain_ai
    user: supplychain_user
